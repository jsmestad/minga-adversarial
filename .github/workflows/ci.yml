name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      # Keep mix.exs out of the workspace root while setup-beam installs Hex.
      - uses: actions/checkout@v4
        with:
          path: extension
      - uses: erlef/setup-beam@v1
        with:
          version-file: extension/.tool-versions
          version-type: strict
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix credo
      - run: mix test --warnings-as-errors
